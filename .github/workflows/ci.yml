name: CI

# Push main đã có deploy-vercel build (gồm lint + type-check), CI chỉ còn để chặn PR
on:
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Phiên bản pnpm lấy từ `packageManager` trong package.json
            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            # PageProps/LayoutProps là type global Next sinh ra trong .next/types
            - run: pnpm exec next typegen
            - run: pnpm exec tsc --noEmit
